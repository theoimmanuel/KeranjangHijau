# PostgreSQL lokal untuk development KeranjangHijau.
# Kredensial dibaca dari file .env (salin dari .env.example, jangan di-commit).
services:
  postgres:
    image: postgres:16
    container_name: keranjanghijau-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?isi POSTGRES_USER di file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
      POSTGRES_DB: ${POSTGRES_DB:-keranjanghijau}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
